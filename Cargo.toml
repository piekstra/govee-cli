[package]
name = "govee-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Govee smart-home devices from the terminal: lights, scenes and segments over the Platform API, rooms over the Govee Home app's private API. Keychain-secured, agent-friendly."
license = "GPL-3.0"
repository = "https://github.com/piekstra/govee-cli"
homepage = "https://github.com/piekstra/govee-cli"
readme = "README.md"
keywords = ["govee", "smart-home", "iot", "lights", "cli"]
categories = ["command-line-utilities"]

# The library keeps its 0.1 crate name so `govee::…` paths in tests and the
# binary stay put; only the package is renamed to the family's `<bin>-cli`.
[lib]
name = "govee"
path = "src/lib.rs"

[[bin]]
name = "govee"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.8.0" }
# The vendor clients are async; pk-cli-http's blocking client is unused here
# (only its `ApiArgs`), so the async reqwest client stays.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
